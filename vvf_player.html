<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVF Player - MAME Vector Video Format</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2a2a2a;
            padding: 15px 20px;
            border-bottom: 2px solid #0080ff;
        }

        .header h1 {
            font-size: 24px;
            color: #0080ff;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #888;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        #vectorCanvas {
            border: 1px solid #444;
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .controls {
            background: #2a2a2a;
            padding: 20px;
            width: 320px;
            border-left: 1px solid #444;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group h3 {
            font-size: 14px;
            color: #0080ff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        button {
            background: #0080ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 8px;
        }

        button:hover {
            background: #0060cc;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }

        input[type="file"] {
            display: none;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #444;
            font-size: 13px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #fff;
            font-weight: bold;
        }

        .playback-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .playback-controls button {
            flex: 1;
        }

        #timeline {
            width: 100%;
            height: 40px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            margin: 10px 0;
        }

        #timelineProgress {
            height: 100%;
            background: linear-gradient(90deg, #0080ff, #00ff80);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        #timeDisplay {
            text-align: center;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            color: #0080ff;
            margin: 10px 0;
        }

        .glow-effect {
            filter: blur(1px) brightness(1.2);
        }

        .stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #0ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 VVF Player</h1>
        <p>MAME Vector Video Format Player - WebGL Edition 🚀</p>
    </div>

    <div class="main-container">
        <div class="canvas-container">
            <canvas id="vectorCanvas"></canvas>
            <div class="stats" id="stats" style="display: none;">
                FPS: <span id="fps">0</span><br>
                Vectors: <span id="vectorCount">0</span><br>
                Frame: <span id="frameNumber">0</span>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>📁 File</h3>
                <button onclick="document.getElementById('fileInput').click()">
                    Open VVF File
                </button>
                <input type="file" id="fileInput" accept=".vvf">
            </div>

            <div class="control-group">
                <h3>▶️ Playback</h3>
                <div class="playback-controls">
                    <button id="playPauseBtn" disabled>▶ Play</button>
                    <button id="stopBtn" disabled>⏹ Stop</button>
                </div>
                <div id="timeline">
                    <div id="timelineProgress"></div>
                </div>
                <div id="timeDisplay">00:00.000 / 00:00.000</div>
            </div>

            <div class="control-group">
                <h3>🎨 Display</h3>
                <label>Line Width: <span id="lineWidthValue">1.0</span></label>
                <input type="range" id="lineWidthSlider" min="0.5" max="3" step="0.1" value="1">
                <br><br>
                <label>Glow Effect: <span id="glowValue">1.0</span></label>
                <input type="range" id="glowSlider" min="0" max="3" step="0.1" value="1">
                <br>
                <label>Brightness: <span id="brightnessValue">1.0</span></label>
                <input type="range" id="brightnessSlider" min="0.5" max="2" step="0.1" value="1">
                <br><br>
                <label>Max Size: <span id="maxSizeValue">Unlimited</span></label>
                <input type="range" id="maxSizeSlider" min="0" max="4000" step="200" value="0">
                <br><small style="color: #666;">WebGL = no limits! 🚀 (0 = unlimited)</small>
                <br><br>
                <small style="color: #888;">Canvas auto-scales to fit window!<br>GPU-accelerated WebGL rendering!</small>
            </div>

            <div class="control-group">
                <h3>ℹ️ File Info</h3>
                <div id="fileInfo">
                    <div class="info-item">
                        <span class="info-label">Status:</span>
                        <span class="info-value" id="statusText">No file loaded</span>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <button onclick="toggleStats()">Toggle Stats</button>
            </div>
        </div>
    </div>

    <script>
        // VVF Player Implementation - WebGL Version
        const canvas = document.getElementById('vectorCanvas');
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

        if (!gl) {
            alert('WebGL not supported! Please use a modern browser.');
            throw new Error('WebGL not supported');
        }

        let vvfData = null;
        let isPlaying = false;
        let currentFrame = 0;
        let animationFrameId = null;
        let startTime = 0;
        let glowIntensity = 1.0;
        let brightness = 1.0;
        let lineWidth = 1.0;
        let maxCanvasSize = 0; // No limit needed with WebGL! Set to 0 by default
        let performanceMode = false; // Not needed with WebGL, but keep for compatibility

        // WebGL resources
        let glProgram = null;
        let glowProgram = null;
        let positionBuffer = null;
        let colorBuffer = null;
        let framebuffer = null;
        let glowTexture = null;

        // Audio resources
        let audioContext = null;
        let audioBuffer = null;
        let audioSource = null;
        let isAudioReady = false;

        // Compression support
        let compressionType = 0; // 0=None, 1=zlib, 2=gzip, 3=bzip2

        // Initialize WebGL
        function initWebGL() {
            // Vertex shader - simple passthrough
            const vertexShaderSource = `
                attribute vec2 a_position;
                attribute vec4 a_color;
                uniform vec2 u_resolution;
                varying vec4 v_color;

                void main() {
                    // Convert from pixel coordinates to clip space (-1 to 1)
                    vec2 clipSpace = (a_position / u_resolution) * 2.0 - 1.0;
                    gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
                    v_color = a_color;
                }
            `;

            // Fragment shader - lines with glow
            const fragmentShaderSource = `
                precision mediump float;
                varying vec4 v_color;
                uniform float u_brightness;

                void main() {
                    gl_FragColor = v_color * u_brightness;
                }
            `;

            // Compile shaders
            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vertexShaderSource);
            gl.compileShader(vertexShader);

            if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
                console.error('Vertex shader compile error:', gl.getShaderInfoLog(vertexShader));
                return false;
            }

            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fragmentShaderSource);
            gl.compileShader(fragmentShader);

            if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
                console.error('Fragment shader compile error:', gl.getShaderInfoLog(fragmentShader));
                return false;
            }

            // Link program
            glProgram = gl.createProgram();
            gl.attachShader(glProgram, vertexShader);
            gl.attachShader(glProgram, fragmentShader);
            gl.linkProgram(glProgram);

            if (!gl.getProgramParameter(glProgram, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(glProgram));
                return false;
            }

            // Get attribute and uniform locations
            glProgram.positionLocation = gl.getAttribLocation(glProgram, 'a_position');
            glProgram.colorLocation = gl.getAttribLocation(glProgram, 'a_color');
            glProgram.resolutionLocation = gl.getUniformLocation(glProgram, 'u_resolution');
            glProgram.brightnessLocation = gl.getUniformLocation(glProgram, 'u_brightness');

            // Create buffers
            positionBuffer = gl.createBuffer();
            colorBuffer = gl.createBuffer();

            // Enable blending for transparency/glow
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE);  // Additive blending for glow effect

            console.log('✅ WebGL initialized successfully');
            return true;
        }

        // Initialize WebGL on load
        if (!initWebGL()) {
            alert('Failed to initialize WebGL!');
        }

        // Initialize Audio
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                console.log('✅ Audio context initialized');
                return true;
            } catch (error) {
                console.error('❌ Failed to initialize audio context:', error);
                return false;
            }
        }

        // Load and decode audio data
        async function loadAudioData(vvfData) {
            if (!audioContext || vvfData.header.audioDataOffset === 0) {
                console.log('ℹ️  No audio data in VVF file');
                return false;
            }

            try {
                // Extract audio data from VVF file
                const audioData = new Uint8Array(vvfData.arrayBuffer, vvfData.header.audioDataOffset);

                if (vvfData.header.audioCodec === 1) { // Opus
                    console.log('🎵 Loading Opus audio data...');
                    // For now, we'll need to implement Opus decoding
                    // This would require a WebAssembly Opus decoder
                    console.warn('⚠️  Opus audio not yet supported in player');
                    return false;
                } else if (vvfData.header.audioCodec === 2) { // PCM
                    console.log('🎵 Loading PCM audio data...');
                    // Convert PCM data to AudioBuffer
                    const sampleRate = vvfData.header.audioSampleRate;
                    const channels = vvfData.header.audioChannels;
                    const samples = audioData.length / (channels * 2); // 16-bit samples

                    audioBuffer = audioContext.createBuffer(channels, samples, sampleRate);

                    // Convert bytes to float samples
                    const dataView = new DataView(audioData.buffer);
                    for (let channel = 0; channel < channels; channel++) {
                        const channelData = audioBuffer.getChannelData(channel);
                        for (let i = 0; i < samples; i++) {
                            const sampleIndex = i * channels + channel;
                            const sample = dataView.getInt16(sampleIndex * 2, true); // Little-endian
                            channelData[i] = sample / 32768.0; // Convert to float
                        }
                    }

                    console.log(`✅ Audio loaded: ${samples} samples, ${channels} channels, ${sampleRate}Hz`);
                    return true;
                }
            } catch (error) {
                console.error('❌ Failed to load audio data:', error);
                return false;
            }

            return false;
        }

        // Play audio
        function playAudio() {
            if (!audioContext || !audioBuffer) return;

            try {
                audioSource = audioContext.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.connect(audioContext.destination);
                audioSource.start();
                console.log('🎵 Audio playback started');
            } catch (error) {
                console.error('❌ Failed to play audio:', error);
            }
        }

        // Stop audio
        function stopAudio() {
            if (audioSource) {
                try {
                    audioSource.stop();
                    audioSource = null;
                    console.log('🎵 Audio playback stopped');
                } catch (error) {
                    console.error('❌ Failed to stop audio:', error);
                }
            }
        }

        // File loading
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            vvfData = parseVVF(arrayBuffer);

            if (vvfData) {
                setupCanvas();
                updateFileInfo();
                document.getElementById('playPauseBtn').disabled = false;

                // Initialize audio and load audio data
                if (initAudio()) {
                    loadAudioData(vvfData).then(success => {
                        isAudioReady = success;
                        if (success) {
                            console.log('🎵 Audio ready for playback');
                        }
                    });
                }
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('statusText').textContent = 'Ready';
            } else {
                alert('Invalid VVF file!');
            }
        });

        // VVF Parser
        function parseVVF(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            let offset = 0;

            // Read header (64 bytes)
            const magic = view.getUint32(offset, true); offset += 4;
            if (magic !== 0x31465656) { // "VVF1"
                console.error('Invalid magic number');
                return null;
            }

            // Read header fields
            const version = view.getUint32(offset, true); offset += 4;
            const nativeWidth = view.getUint16(offset, true); offset += 2;
            const nativeHeight = view.getUint16(offset, true); offset += 2;
            const vvfWidth = view.getUint16(offset, true); offset += 2;
            const vvfHeight = view.getUint16(offset, true); offset += 2;
            const frameRate = view.getUint32(offset, true); offset += 4;
            const totalFrames = view.getUint32(offset, true); offset += 4;
            const audioSampleRate = view.getUint32(offset, true); offset += 4;
            const audioChannels = view.getUint8(offset); offset += 1;
            const audioCodec = view.getUint8(offset); offset += 1;
            const reserved1 = view.getUint16(offset, true); offset += 2;
            const frameIndexOffset = Number(view.getBigUint64(offset, true)); offset += 8;
            const audioDataOffset = Number(view.getBigUint64(offset, true)); offset += 8;
            const durationUs = Number(view.getBigUint64(offset, true)); offset += 8;
            const compressionType = view.getUint32(offset, true); offset += 4;

            const header = {
                version,
                nativeWidth,
                nativeHeight,
                vvfWidth,
                vvfHeight,
                frameRate,
                totalFrames,
                audioSampleRate,
                audioChannels,
                audioCodec,
                reserved1,
                frameIndexOffset,
                audioDataOffset,
                durationUs,
                compressionType
            };

            console.log('VVF Header:', header);
            console.log('Aspect ratio:', header.nativeWidth / header.nativeHeight);
            console.log('VVF coords:', header.vvfWidth, 'x', header.vvfHeight);
            console.log('Audio:', header.audioCodec === 1 ? 'Opus' : header.audioCodec === 2 ? 'PCM' : 'None');
            console.log('Compression:', header.compressionType === 0 ? 'None' :
                header.compressionType === 1 ? 'zlib' :
                header.compressionType === 2 ? 'gzip' :
                header.compressionType === 3 ? 'bzip2' : 'Unknown');

            // Parse frames
            const frames = [];
            offset = 60; // Skip header (60 bytes - struct padding makes it 60, not 56!)

            console.log(`📊 Starting frame parse: ${header.totalFrames} frames, frameIndexOffset=${header.frameIndexOffset}, starting at offset ${offset}`);

            // Check if frameIndexOffset is valid
            if (header.frameIndexOffset === 0 || header.frameIndexOffset < offset) {
                console.warn(`⚠️  frameIndexOffset=${header.frameIndexOffset} seems invalid (should be > ${offset})`);
                console.warn(`   Will parse until audioDataOffset=${header.audioDataOffset} or buffer end`);
            }

            // State for rendering
            let currentColor = {r: 255, g: 255, b: 255};
            let currentIntensity = 255;
            let lastX = 0, lastY = 0;
            const palette = []; // Array of {r, g, b, intensity} - up to 256 entries
            let currentPaletteIndex = 0;

            let debugCommandCount = 0;
            const debugMaxCommands = 20; // Log first 20 commands

            for (let f = 0; f < header.totalFrames && offset < header.frameIndexOffset; f++) {
                const frame = {vectors: [], timestamp: 0};

                while (offset < arrayBuffer.byteLength && offset < header.frameIndexOffset) {
                    const cmd = view.getUint8(offset);

                    // Debug first frame's commands
                    if (f === 0 && debugCommandCount < debugMaxCommands) {
                        console.log(`  Frame ${f}, cmd @ offset ${offset}: 0x${cmd.toString(16).padStart(2, '0')}`);
                        debugCommandCount++;
                    }

                    offset++;

                    if (cmd === 0x00) { // END_FRAME
                        frame.timestamp = view.getUint32(offset, true);
                        offset += 4;
                        break;
                    } else if (cmd === 0x50) { // NEW_COLOR (5 bytes)
                        const r = view.getUint8(offset); offset++;
                        const g = view.getUint8(offset); offset++;
                        const b = view.getUint8(offset); offset++;
                        const intensity = view.getUint8(offset); offset++;

                        // Add to palette
                        palette.push({r, g, b, intensity});
                        currentPaletteIndex = palette.length - 1;
                        currentColor = {r, g, b};
                        currentIntensity = intensity;
                    } else if (
                        cmd === 0x60 || cmd === 0x61 || // LINE_TO4, LINE_TO4_PAL
                        cmd === 0x62 || cmd === 0x63 || // LINE_TO8, LINE_TO8_PAL
                        cmd === 0x64 || cmd === 0x65    // LINE_TO12, LINE_TO12_PAL
                    ) {
                        // Helper to maybe set palette and always returns new offset (DRY)
                        function maybeSetPalette(cmd, offset) {
                            // accepts offset (JS local variable 'offset'), returns updated offset
                            let paletteIndex = null;
                            if (
                                cmd === 0x61 || // LINE_TO4_PAL
                                cmd === 0x63 || // LINE_TO8_PAL
                                cmd === 0x65    // LINE_TO12_PAL
                            ) {
                                paletteIndex = view.getUint8(offset); // 8-bit palette index (256 entries)
                                offset++;
                                if (paletteIndex < palette.length) {
                                    currentPaletteIndex = paletteIndex;
                                    currentColor = {
                                        r: palette[paletteIndex].r,
                                        g: palette[paletteIndex].g,
                                        b: palette[paletteIndex].b
                                    };
                                    currentIntensity = palette[paletteIndex].intensity;
                                }
                            }
                            return offset;
                        }

                        let dx = 0, dy = 0;

                        if (cmd === 0x60 || cmd === 0x61) {
                            // 4-bit
                            const deltaPacked = view.getUint8(offset); offset++;
                            offset = maybeSetPalette(cmd, offset);
                            // Unpack 4-bit signed deltas
                            dx = deltaPacked & 0x0F;
                            dy = (deltaPacked >> 4) & 0x0F;
                            if (dx > 7) dx -= 16;
                            if (dy > 7) dy -= 16;
                        } else if (cmd === 0x62 || cmd === 0x63) {
                            // 8-bit
                            dx = view.getInt8(offset); offset++;
                            dy = view.getInt8(offset); offset++;
                            offset = maybeSetPalette(cmd, offset);
                        } else if (cmd === 0x64 || cmd === 0x65) {
                            // 12-bit ABSOLUTE coordinates (not deltas!)
                            const byte0 = view.getUint8(offset); offset++;
                            const byte1 = view.getUint8(offset); offset++;
                            const byte2 = view.getUint8(offset); offset++;
                            offset = maybeSetPalette(cmd, offset);
                            const packed = byte0 | (byte1 << 8) | (byte2 << 16);
                            // Extract absolute coordinates (0-4095 unsigned)
                            dx = packed & 0x0FFF;          // X absolute position
                            dy = (packed >> 12) & 0x0FFF;  // Y absolute position
                            // Note: These are now absolute positions, not deltas!
                        }

                        // LINE_TO4/8 use deltas, LINE_TO12 uses absolute coordinates
                        const x2 = (cmd === 0x64 || cmd === 0x65) ? dx : (lastX + dx);
                        const y2 = (cmd === 0x64 || cmd === 0x65) ? dy : (lastY + dy);

                        frame.vectors.push({
                            type: 'line',
                            x1: lastX, y1: lastY,
                            x2, y2,
                            r: currentColor.r,
                            g: currentColor.g,
                            b: currentColor.b,
                            intensity: currentIntensity
                        });
                        lastX = x2;
                        lastY = y2;

                        // Debug first few vectors
                        if (f === 0 && frame.vectors.length <= 3) {
                            console.log(`    Vector ${frame.vectors.length}: (${x2}, ${y2}) intensity=${currentIntensity}`);
                        }
                    } else {
                        // Unknown command!
                        console.error(`❌ Unknown command 0x${cmd.toString(16).padStart(2, '0')} at offset ${offset-1} in frame ${f}`);
                        console.error(`   Stopping parse. Parsed ${f} frames so far.`);
                        console.error(`   This might be frame index data (frameIndexOffset=${header.frameIndexOffset})`);
                        break; // Exit while loop
                    }
                }

                frames.push(frame);

                // Debug frame summary
                if (f < 3 || f === header.totalFrames - 1) {
                    console.log(`📦 Frame ${f}: ${frame.vectors.length} vectors, timestamp=${frame.timestamp}ms`);
                }
            }

            console.log(`✅ Parse complete: ${frames.length} frames parsed`);

            return {header, frames};
        }

        // Canvas setup
        function setupCanvas() {
            // Get container dimensions
            const container = document.querySelector('.canvas-container');
            const containerWidth = container.clientWidth - 20; // Leave some margin
            const containerHeight = container.clientHeight - 20;

            // Use native dimensions for aspect ratio
            const aspectRatio = vvfData.header.nativeWidth / vvfData.header.nativeHeight;

            // Calculate canvas size to fit container while maintaining aspect ratio
            let canvasWidth, canvasHeight;

            if (containerWidth / containerHeight > aspectRatio) {
                // Container is wider than needed - limit by height
                canvasHeight = containerHeight;
                canvasWidth = containerHeight * aspectRatio;
            } else {
                // Container is taller than needed - limit by width
                canvasWidth = containerWidth;
                canvasHeight = containerWidth / aspectRatio;
            }

            // Apply performance limit if enabled
            if (maxCanvasSize > 0) {
                const maxDimension = Math.max(canvasWidth, canvasHeight);
                if (maxDimension > maxCanvasSize) {
                    const scale = maxCanvasSize / maxDimension;
                    canvasWidth *= scale;
                    canvasHeight *= scale;
                    console.log(`⚡ Performance limit applied: scaled to ${scale.toFixed(2)}x`);
                }
            }

            // Set canvas size (actual pixels)
            canvas.width = Math.floor(canvasWidth);
            canvas.height = Math.floor(canvasHeight);

            // Auto-enable performance mode for large canvases
            const totalPixels = canvas.width * canvas.height;
            performanceMode = totalPixels > 4000000; // > 4 megapixels
            if (performanceMode) {
                console.log(`🚀 Performance mode: ${(totalPixels / 1000000).toFixed(1)}MP canvas`);
            }

            console.log(`Canvas: ${canvas.width}×${canvas.height} (aspect: ${aspectRatio.toFixed(3)}, ${(totalPixels / 1000000).toFixed(1)}MP)`);
        }

        // Rendering
        function renderFrame(frameIndex) {
            if (!vvfData || frameIndex >= vvfData.frames.length) {
                if (!vvfData) console.error('❌ renderFrame: vvfData is null');
                if (frameIndex >= vvfData?.frames.length) console.error(`❌ renderFrame: frameIndex ${frameIndex} >= ${vvfData?.frames.length}`);
                return;
            }

            // Calculate scale based on canvas size vs VVF coordinate range
            const scaleX = canvas.width / vvfData.header.vvfWidth;
            const scaleY = canvas.height / vvfData.header.vvfHeight;
            const frame = vvfData.frames[frameIndex];

            // Debug first frame
            if (frameIndex === 0 || frameIndex === 1) {
                console.log(`🎨 WebGL rendering frame ${frameIndex}: ${frame.vectors.length} vectors (scale: ${scaleX.toFixed(2)}x${scaleY.toFixed(2)})`);
            }

            // Clear with black background
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Use shader program
            gl.useProgram(glProgram);

            // Set uniforms
            gl.uniform2f(glProgram.resolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(glProgram.brightnessLocation, brightness);

            // Set line width
            gl.lineWidth(lineWidth);

            // Build vertex arrays for all lines (2 vertices per line)
            const positions = [];
            const colors = [];

            frame.vectors.forEach(vec => {
                if (vec.type === 'line') {
                    // Skip invisible moves (intensity=0)
                    if (vec.intensity === 0) {
                        return; // Don't render invisible beam moves
                    }

                    // Scale coordinates to canvas space
                    const x1 = vec.x1 * scaleX;
                    const y1 = vec.y1 * scaleY;
                    const x2 = vec.x2 * scaleX;
                    const y2 = vec.y2 * scaleY;

                    // Calculate alpha based on intensity
                    const alpha = (vec.intensity / 255);

                    // Normalize color to 0-1 range
                    const r = vec.r / 255;
                    const g = vec.g / 255;
                    const b = vec.b / 255;

                    // Add line vertices (start and end)
                    positions.push(x1, y1, x2, y2);

                    // Add colors for both vertices (same color)
                    colors.push(r, g, b, alpha, r, g, b, alpha);
                }
            });

            // Upload position data
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(glProgram.positionLocation);
            gl.vertexAttribPointer(glProgram.positionLocation, 2, gl.FLOAT, false, 0, 0);

            // Upload color data
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(glProgram.colorLocation);
            gl.vertexAttribPointer(glProgram.colorLocation, 4, gl.FLOAT, false, 0, 0);

            // Draw all lines in one call!
            const numLines = positions.length / 2;
            gl.drawArrays(gl.LINES, 0, numLines);

            // Render glow pass if enabled
            if (glowIntensity > 0) {
                // Second pass with larger lines and lower opacity for glow
                gl.lineWidth(lineWidth + glowIntensity * 2);
                gl.uniform1f(glProgram.brightnessLocation, brightness * glowIntensity * 0.3);
                gl.drawArrays(gl.LINES, 0, numLines);

                // Third pass with even larger lines for outer glow
                if (glowIntensity > 1) {
                    gl.lineWidth(lineWidth + glowIntensity * 4);
                    gl.uniform1f(glProgram.brightnessLocation, brightness * glowIntensity * 0.15);
                    gl.drawArrays(gl.LINES, 0, numLines);
                }
            }

            // Update stats
            document.getElementById('vectorCount').textContent = frame.vectors.length;
            document.getElementById('frameNumber').textContent = frameIndex;
        }

        // Playback controls
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', stop);

        function play() {
            if (!vvfData) {
                console.error('❌ Cannot play: vvfData is null');
                return;
            }
            console.log(`▶️  Starting playback: ${vvfData.frames.length} frames at ${vvfData.header.frameRate / 1000} Hz`);
            isPlaying = true;
            document.getElementById('playPauseBtn').textContent = '⏸ Pause';
            startTime = performance.now();

            // Start audio playback if available
            if (isAudioReady) {
                playAudio();
            }

            requestAnimationFrame(playbackLoop);
        }

        function pause() {
            isPlaying = false;
            document.getElementById('playPauseBtn').textContent = '▶ Play';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }

        function stop() {
            pause();
            currentFrame = 0;
            lastRenderedFrame = -1; // Reset so first frame renders
            renderFrame(0);
            updateTimeDisplay();

            // Stop audio playback
            stopAudio();
        }

        let lastRenderedFrame = -1; // Track which frame we last rendered

        function playbackLoop() {
            if (!isPlaying) return;

            const elapsed = (performance.now() - startTime) / 1000;
            const frameRate = vvfData.header.frameRate / 1000;
            const targetFrame = Math.floor(elapsed * frameRate);

            if (targetFrame < vvfData.frames.length) {
                currentFrame = targetFrame;
                // Only render if frame actually changed (prevents re-rendering same frame at 60Hz)
                if (currentFrame !== lastRenderedFrame) {
                    renderFrame(currentFrame);
                    lastRenderedFrame = currentFrame;
                }
                updateTimeDisplay();
                animationFrameId = requestAnimationFrame(playbackLoop);
            } else {
                stop();
            }
        }

        function updateTimeDisplay() {
            if (!vvfData) return;
            const current = currentFrame / (vvfData.header.frameRate / 1000);
            const total = vvfData.header.durationUs / 1000000;
            document.getElementById('timeDisplay').textContent =
                `${formatTime(current)} / ${formatTime(total)}`;
            document.getElementById('timelineProgress').style.width =
                `${(currentFrame / vvfData.frames.length) * 100}%`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(3);
            return `${mins.toString().padStart(2, '0')}:${secs.padStart(6, '0')}`;
        }

        function updateFileInfo() {
            if (!vvfData) return;
            const h = vvfData.header;
            const html = `
                <div class="info-item">
                    <span class="info-label">Resolution:</span>
                    <span class="info-value">${h.width}x${h.height}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Frame Rate:</span>
                    <span class="info-value">${(h.frameRate/1000).toFixed(2)} fps</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Total Frames:</span>
                    <span class="info-value">${h.totalFrames}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Duration:</span>
                    <span class="info-value">${(h.durationUs/1000000).toFixed(2)}s</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span class="info-value" id="statusText">Ready</span>
                </div>
            `;
            document.getElementById('fileInfo').innerHTML = html;
        }

        // Controls
        // Window resize handler - makes canvas responsive!
        let resizeTimeout;
        window.addEventListener('resize', () => {
            if (!vvfData) return;

            // Debounce resize events (wait 150ms after last resize)
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                setupCanvas();
                renderFrame(currentFrame);
            }, 150);
        });

        document.getElementById('lineWidthSlider').addEventListener('input', (e) => {
            lineWidth = parseFloat(e.target.value);
            document.getElementById('lineWidthValue').textContent = lineWidth.toFixed(1);
            renderFrame(currentFrame);
        });

        document.getElementById('glowSlider').addEventListener('input', (e) => {
            glowIntensity = parseFloat(e.target.value);
            document.getElementById('glowValue').textContent = glowIntensity.toFixed(1);
            renderFrame(currentFrame);
        });

        document.getElementById('brightnessSlider').addEventListener('input', (e) => {
            brightness = parseFloat(e.target.value);
            document.getElementById('brightnessValue').textContent = brightness.toFixed(1);
            renderFrame(currentFrame);
        });

        document.getElementById('maxSizeSlider').addEventListener('input', (e) => {
            maxCanvasSize = parseInt(e.target.value);
            const displayValue = maxCanvasSize === 0 ? 'Unlimited' : `${maxCanvasSize}px`;
            document.getElementById('maxSizeValue').textContent = displayValue;
            if (vvfData) {
                setupCanvas();
                renderFrame(currentFrame);
            }
        });

        document.getElementById('timeline').addEventListener('click', (e) => {
            if (!vvfData) return;
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = x / rect.width;
            currentFrame = Math.floor(percent * vvfData.frames.length);
            lastRenderedFrame = -1; // Force re-render after seek
            renderFrame(currentFrame);
            updateTimeDisplay();
        });

        function toggleStats() {
            const stats = document.getElementById('stats');
            stats.style.display = stats.style.display === 'none' ? 'block' : 'none';
        }

        // FPS counter
        let lastFrameTime = performance.now();
        let frameCount = 0;
        setInterval(() => {
            const now = performance.now();
            const fps = frameCount / ((now - lastFrameTime) / 1000);
            document.getElementById('fps').textContent = fps.toFixed(1);
            frameCount = 0;
            lastFrameTime = now;
        }, 1000);

        // Initialize
        document.getElementById('statusText').textContent = 'No file loaded';
    </script>
</body>
</html>
