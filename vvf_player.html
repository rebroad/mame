<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVF Player - MAME Vector Video Format</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2a2a2a;
            padding: 15px 20px;
            border-bottom: 2px solid #0080ff;
        }

        .header h1 {
            font-size: 24px;
            color: #0080ff;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #888;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        #vectorCanvas {
            border: 1px solid #444;
            cursor: crosshair;
        }

        .controls {
            background: #2a2a2a;
            padding: 20px;
            width: 320px;
            border-left: 1px solid #444;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group h3 {
            font-size: 14px;
            color: #0080ff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        button {
            background: #0080ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 8px;
        }

        button:hover {
            background: #0060cc;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }

        input[type="file"] {
            display: none;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #444;
            font-size: 13px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #fff;
            font-weight: bold;
        }

        .playback-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .playback-controls button {
            flex: 1;
        }

        #timeline {
            width: 100%;
            height: 40px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            margin: 10px 0;
        }

        #timelineProgress {
            height: 100%;
            background: linear-gradient(90deg, #0080ff, #00ff80);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        #timeDisplay {
            text-align: center;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            color: #0080ff;
            margin: 10px 0;
        }

        .glow-effect {
            filter: blur(1px) brightness(1.2);
        }

        .stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #0ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 VVF Player</h1>
        <p>MAME Vector Video Format Player - Infinite Resolution, Zero Artifacts</p>
    </div>

    <div class="main-container">
        <div class="canvas-container">
            <canvas id="vectorCanvas"></canvas>
            <div class="stats" id="stats" style="display: none;">
                FPS: <span id="fps">0</span><br>
                Vectors: <span id="vectorCount">0</span><br>
                Frame: <span id="frameNumber">0</span>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>📁 File</h3>
                <button onclick="document.getElementById('fileInput').click()">
                    Open VVF File
                </button>
                <input type="file" id="fileInput" accept=".vvf">
            </div>

            <div class="control-group">
                <h3>▶️ Playback</h3>
                <div class="playback-controls">
                    <button id="playPauseBtn" disabled>▶ Play</button>
                    <button id="stopBtn" disabled>⏹ Stop</button>
                </div>
                <div id="timeline">
                    <div id="timelineProgress"></div>
                </div>
                <div id="timeDisplay">00:00.000 / 00:00.000</div>
            </div>

            <div class="control-group">
                <h3>🎨 Display</h3>
                <label>Resolution</label>
                <select id="resolutionSelect">
                    <option value="1">1x Native</option>
                    <option value="2">2x Native</option>
                    <option value="3">3x Native</option>
                    <option value="4" selected>4x Native</option>
                    <option value="6">6x Native</option>
                    <option value="8">8x Native</option>
                </select>
                <br><br>
                <label>Glow Effect: <span id="glowValue">1.0</span></label>
                <input type="range" id="glowSlider" min="0" max="3" step="0.1" value="1">
                <br>
                <label>Brightness: <span id="brightnessValue">1.0</span></label>
                <input type="range" id="brightnessSlider" min="0.5" max="2" step="0.1" value="1">
            </div>

            <div class="control-group">
                <h3>ℹ️ File Info</h3>
                <div id="fileInfo">
                    <div class="info-item">
                        <span class="info-label">Status:</span>
                        <span class="info-value" id="statusText">No file loaded</span>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <button onclick="toggleStats()">Toggle Stats</button>
            </div>
        </div>
    </div>

    <script>
        // VVF Player Implementation
        const canvas = document.getElementById('vectorCanvas');
        const ctx = canvas.getContext('2d');

        let vvfData = null;
        let isPlaying = false;
        let currentFrame = 0;
        let animationFrameId = null;
        let startTime = 0;
        let glowIntensity = 1.0;
        let brightness = 1.0;

        // File loading
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            vvfData = parseVVF(arrayBuffer);

            if (vvfData) {
                setupCanvas();
                updateFileInfo();
                document.getElementById('playPauseBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('statusText').textContent = 'Ready';
            } else {
                alert('Invalid VVF file!');
            }
        });

        // VVF Parser
        function parseVVF(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            let offset = 0;

            // Read header (64 bytes)
            const magic = view.getUint32(offset, true); offset += 4;
            if (magic !== 0x31465656) { // "VVF1"
                console.error('Invalid magic number');
                return null;
            }

            const header = {
                version: view.getUint32(offset, true), offset += 4,
                nativeWidth: view.getUint16(offset, true), offset += 2,
                nativeHeight: view.getUint16(offset, true), offset += 2,
                vvfWidth: view.getUint16(offset, true), offset += 2,
                vvfHeight: view.getUint16(offset, true), offset += 2,
                frameRate: view.getUint32(offset, true), offset += 4,
                totalFrames: view.getUint32(offset, true), offset += 4,
                audioSampleRate: view.getUint32(offset, true), offset += 4,
                audioChannels: view.getUint8(offset, true), offset += 1,
                audioCodec: view.getUint8(offset, true), offset += 1,
                reserved1: view.getUint16(offset, true), offset += 2,
                frameIndexOffset: Number(view.getBigUint64(offset, true)), offset += 8,
                audioDataOffset: Number(view.getBigUint64(offset, true)), offset += 8,
                durationUs: Number(view.getBigUint64(offset, true)), offset += 8,
                reserved2: view.getUint32(offset, true), offset += 4,
            };

            console.log('VVF Header:', header);
            console.log('Aspect ratio:', header.nativeWidth / header.nativeHeight);
            console.log('VVF coords:', header.vvfWidth, 'x', header.vvfHeight);

            // Parse frames
            const frames = [];
            offset = 56; // Skip header (56 bytes)

            // State for rendering
            let currentColor = {r: 255, g: 255, b: 255};
            let currentIntensity = 255;
            let lastX = 0, lastY = 0;
            const palette = []; // Array of {r, g, b, intensity} - up to 256 entries
            let currentPaletteIndex = 0;

            for (let f = 0; f < header.totalFrames && offset < header.frameIndexOffset; f++) {
                const frame = {vectors: [], timestamp: 0};

                while (offset < arrayBuffer.byteLength) {
                    const cmd = view.getUint8(offset);
                    offset++;

                    if (cmd === 0x00) { // END_FRAME
                        frame.timestamp = view.getUint32(offset, true);
                        offset += 4;
                        break;
                    } else if (cmd === 0x50) { // NEW_COLOR (5 bytes)
                        const r = view.getUint8(offset); offset++;
                        const g = view.getUint8(offset); offset++;
                        const b = view.getUint8(offset); offset++;
                        const intensity = view.getUint8(offset); offset++;

                        // Add to palette
                        palette.push({r, g, b, intensity});
                        currentPaletteIndex = palette.length - 1;
                        currentColor = {r, g, b};
                        currentIntensity = intensity;
                    } else if (
                        cmd === 0x60 || cmd === 0x61 || // LINE_TO4, LINE_TO4_PAL
                        cmd === 0x62 || cmd === 0x63 || // LINE_TO8, LINE_TO8_PAL
                        cmd === 0x64 || cmd === 0x65    // LINE_TO12, LINE_TO12_PAL
                    ) {
                        // Helper to maybe set palette and always returns new offset (DRY)
                        function maybeSetPalette(cmd, offset) {
                            // accepts offset (JS local variable 'offset'), returns updated offset
                            let paletteIndex = null;
                            if (
                                cmd === 0x61 || // LINE_TO4_PAL
                                cmd === 0x63 || // LINE_TO8_PAL
                                cmd === 0x65    // LINE_TO12_PAL
                            ) {
                                paletteIndex = view.getUint8(offset); // 8-bit palette index (256 entries)
                                offset++;
                                if (paletteIndex < palette.length) {
                                    currentPaletteIndex = paletteIndex;
                                    currentColor = {
                                        r: palette[paletteIndex].r,
                                        g: palette[paletteIndex].g,
                                        b: palette[paletteIndex].b
                                    };
                                    currentIntensity = palette[paletteIndex].intensity;
                                }
                            }
                            return offset;
                        }

                        let dx = 0, dy = 0;

                        if (cmd === 0x60 || cmd === 0x61) {
                            // 4-bit
                            const deltaPacked = view.getUint8(offset); offset++;
                            offset = maybeSetPalette(cmd, offset);
                            // Unpack 4-bit signed deltas
                            dx = deltaPacked & 0x0F;
                            dy = (deltaPacked >> 4) & 0x0F;
                            if (dx > 7) dx -= 16;
                            if (dy > 7) dy -= 16;
                        } else if (cmd === 0x62 || cmd === 0x63) {
                            // 8-bit
                            dx = view.getInt8(offset); offset++;
                            dy = view.getInt8(offset); offset++;
                            offset = maybeSetPalette(cmd, offset);
                        } else if (cmd === 0x64 || cmd === 0x65) {
                            // 12-bit
                            const byte0 = view.getUint8(offset); offset++;
                            const byte1 = view.getUint8(offset); offset++;
                            const byte2 = view.getUint8(offset); offset++;
                            offset = maybeSetPalette(cmd, offset);
                            const packed = byte0 | (byte1 << 8) | (byte2 << 16);
                            dx = packed & 0x0FFF;
                            dy = (packed >> 12) & 0x0FFF;
                            if (dx > 2047) dx -= 4096;
                            if (dy > 2047) dy -= 4096;
                        }

                        const x2 = lastX + dx;
                        const y2 = lastY + dy;

                        frame.vectors.push({
                            type: 'line',
                            x1: lastX, y1: lastY,
                            x2, y2,
                            r: currentColor.r,
                            g: currentColor.g,
                            b: currentColor.b,
                            intensity: currentIntensity
                        });
                        lastX = x2;
                        lastY = y2;
                    }
                }

                frames.push(frame);
            }

            return {header, frames};
        }

        // Canvas setup
        function setupCanvas() {
            const scale = parseInt(document.getElementById('resolutionSelect').value);

            // Use native dimensions for aspect ratio
            const aspectRatio = vvfData.header.nativeWidth / vvfData.header.nativeHeight;

            // Size canvas based on VVF coordinate range, maintaining native aspect ratio
            const baseSize = Math.max(vvfData.header.vvfWidth, vvfData.header.vvfHeight);

            if (aspectRatio >= 1.0) {
                // Wider than tall
                canvas.width = baseSize * scale;
                canvas.height = (baseSize / aspectRatio) * scale;
            } else {
                // Taller than wide
                canvas.height = baseSize * scale;
                canvas.width = baseSize * aspectRatio * scale;
            }

            console.log(`Canvas: ${canvas.width}×${canvas.height} (aspect: ${aspectRatio.toFixed(3)}, native: ${vvfData.header.nativeWidth}×${vvfData.header.nativeHeight})`);
        }

        // Rendering
        function renderFrame(frameIndex) {
            if (!vvfData || frameIndex >= vvfData.frames.length) return;

            const scale = parseInt(document.getElementById('resolutionSelect').value);
            const frame = vvfData.frames[frameIndex];

            // Clear with black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Set up glow effect
            ctx.shadowBlur = glowIntensity * 5;
            ctx.lineWidth = Math.max(1, scale * 0.5);
            ctx.lineCap = 'round';

            // Render vectors
            frame.vectors.forEach(vec => {
                if (vec.type === 'line') {
                    const alpha = (vec.intensity / 255) * brightness;
                    const color = `rgba(${vec.r}, ${vec.g}, ${vec.b}, ${alpha})`;
                    ctx.strokeStyle = color;
                    ctx.shadowColor = color;

                    ctx.beginPath();
                    ctx.moveTo(vec.x1 * scale, vec.y1 * scale);
                    ctx.lineTo(vec.x2 * scale, vec.y2 * scale);
                    ctx.stroke();
                }
            });

            // Update stats
            document.getElementById('vectorCount').textContent = frame.vectors.length;
            document.getElementById('frameNumber').textContent = frameIndex;
        }

        // Playback controls
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', stop);

        function play() {
            if (!vvfData) return;
            isPlaying = true;
            document.getElementById('playPauseBtn').textContent = '⏸ Pause';
            startTime = performance.now();
            requestAnimationFrame(playbackLoop);
        }

        function pause() {
            isPlaying = false;
            document.getElementById('playPauseBtn').textContent = '▶ Play';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }

        function stop() {
            pause();
            currentFrame = 0;
            renderFrame(0);
            updateTimeDisplay();
        }

        function playbackLoop() {
            if (!isPlaying) return;

            const elapsed = (performance.now() - startTime) / 1000;
            const frameRate = vvfData.header.frameRate / 1000;
            const targetFrame = Math.floor(elapsed * frameRate);

            if (targetFrame < vvfData.frames.length) {
                currentFrame = targetFrame;
                renderFrame(currentFrame);
                updateTimeDisplay();
                animationFrameId = requestAnimationFrame(playbackLoop);
            } else {
                stop();
            }
        }

        function updateTimeDisplay() {
            if (!vvfData) return;
            const current = currentFrame / (vvfData.header.frameRate / 1000);
            const total = vvfData.header.durationUs / 1000000;
            document.getElementById('timeDisplay').textContent =
                `${formatTime(current)} / ${formatTime(total)}`;
            document.getElementById('timelineProgress').style.width =
                `${(currentFrame / vvfData.frames.length) * 100}%`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(3);
            return `${mins.toString().padStart(2, '0')}:${secs.padStart(6, '0')}`;
        }

        function updateFileInfo() {
            if (!vvfData) return;
            const h = vvfData.header;
            const html = `
                <div class="info-item">
                    <span class="info-label">Resolution:</span>
                    <span class="info-value">${h.width}x${h.height}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Frame Rate:</span>
                    <span class="info-value">${(h.frameRate/1000).toFixed(2)} fps</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Total Frames:</span>
                    <span class="info-value">${h.totalFrames}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Duration:</span>
                    <span class="info-value">${(h.durationUs/1000000).toFixed(2)}s</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span class="info-value" id="statusText">Ready</span>
                </div>
            `;
            document.getElementById('fileInfo').innerHTML = html;
        }

        // Controls
        document.getElementById('resolutionSelect').addEventListener('change', () => {
            setupCanvas();
            renderFrame(currentFrame);
        });

        document.getElementById('glowSlider').addEventListener('input', (e) => {
            glowIntensity = parseFloat(e.target.value);
            document.getElementById('glowValue').textContent = glowIntensity.toFixed(1);
            renderFrame(currentFrame);
        });

        document.getElementById('brightnessSlider').addEventListener('input', (e) => {
            brightness = parseFloat(e.target.value);
            document.getElementById('brightnessValue').textContent = brightness.toFixed(1);
            renderFrame(currentFrame);
        });

        document.getElementById('timeline').addEventListener('click', (e) => {
            if (!vvfData) return;
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = x / rect.width;
            currentFrame = Math.floor(percent * vvfData.frames.length);
            renderFrame(currentFrame);
            updateTimeDisplay();
        });

        function toggleStats() {
            const stats = document.getElementById('stats');
            stats.style.display = stats.style.display === 'none' ? 'block' : 'none';
        }

        // FPS counter
        let lastFrameTime = performance.now();
        let frameCount = 0;
        setInterval(() => {
            const now = performance.now();
            const fps = frameCount / ((now - lastFrameTime) / 1000);
            document.getElementById('fps').textContent = fps.toFixed(1);
            frameCount = 0;
            lastFrameTime = now;
        }, 1000);

        // Initialize
        document.getElementById('statusText').textContent = 'No file loaded';
    </script>
</body>
</html>
